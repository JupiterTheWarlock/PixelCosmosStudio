[preset.0]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/*.json,assets/ui/*.txt,docs/IMPORT_GUIDE.md,docs/ANIMATION_GUIDE.md,THIRD_PARTY_NOTICES.md,LICENSE,*.gdshaderinc,*.gdshader"
exclude_filter="tests/*,tools/*,exports/*,dist/*,adapters/threejs/*,adapters/unity/*,adapters/unreal/*"
export_path="dist/web/index.html"
script_export_mode=1

[preset.0.options]
custom_template/debug=".tools/templates/4.4.1.stable/web_nothreads_debug.zip"
custom_template/release=".tools/templates/4.4.1.stable/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]
name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/*.json,assets/ui/*.txt,docs/IMPORT_GUIDE.md,docs/ANIMATION_GUIDE.md,THIRD_PARTY_NOTICES.md,LICENSE,*.gdshaderinc,*.gdshader"
exclude_filter="tests/*,tools/*,exports/*,dist/*,adapters/threejs/*,adapters/unity/*,adapters/unreal/*"
export_path="dist/windows/PixelCosmosStudio.exe"
script_export_mode=1

[preset.1.options]
custom_template/debug=".tools/templates/4.4.1.stable/windows_debug_x86_64.exe"
custom_template/release=".tools/templates/4.4.1.stable/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=0
codesign/enable=false
application/product_name="Pixel Cosmos Studio"
application/file_description="Pixel and voxel planet / skybox generator"
application/company_name="JupiterTheWarlock"
application/product_version="0.1.0.0"
application/file_version="0.1.0.0"
